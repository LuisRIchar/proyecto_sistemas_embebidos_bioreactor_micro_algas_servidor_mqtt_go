services:
  servidor-mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt_serve
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
  
  base-datos:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: contra12345
      POSTGRES_DB: bioreactor_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_datos:/var/lib/postgresql/data
    
  servidor-go:
    build: ./go
    depends_on:
      - servidor-mqtt
      - base-datos
    container_name: go
    volumes:
      - ./go:/app
    ports:
      - "9090:9090"
    stdin_open: true
    tty: true